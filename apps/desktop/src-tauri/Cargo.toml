[package]
name = "agentev4-desktop"
version = "0.0.0"
description = "Agentev4 - App de escritorio (Tauri v2, Fase 11)"
edition = "2021"

[lib]
name = "agentev4_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
